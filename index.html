<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Virtual Piano</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Basic Virtual Piano</h1>
    <p class="hint">Click keys or use keyboard: <strong>A S D F G H J</strong></p>

    <section class="piano" aria-label="Virtual piano">
      <button class="key white" data-note="261.63" data-key="a"><span>A</span><small>C4</small></button>
      <button class="key white" data-note="293.66" data-key="s"><span>S</span><small>D4</small></button>
      <button class="key white" data-note="329.63" data-key="d"><span>D</span><small>E4</small></button>
      <button class="key white" data-note="349.23" data-key="f"><span>F</span><small>F4</small></button>
      <button class="key white" data-note="392.00" data-key="g"><span>G</span><small>G4</small></button>
      <button class="key white" data-note="440.00" data-key="h"><span>H</span><small>A4</small></button>
      <button class="key white" data-note="493.88" data-key="j"><span>J</span><small>B4</small></button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
